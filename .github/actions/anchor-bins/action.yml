name: anchor-bins
description: >
  Populate anchor/bin with the pinned anchor binaries, fetched from the `shelf` release
  of veil-net/anchor.

inputs:
  app-id:
    description: >
      The App ID of the GitHub App that can read anchor. Pass secrets.ANCHOR_APP_ID.
    required: true
  private-key:
    description: >
      That App's private key, whole, including its BEGIN and END lines. Pass
      secrets.ANCHOR_APP_PRIVATE_KEY.
    required: true
  targets:
    description: >
      The pairs to fetch, space-separated -- darwin-arm64, windows-amd64 -- for a job
      that builds for one platform. Empty fetches every target.
    required: false
    default: ""
  repo:
    description: >
      The owner/name holding the release. Defaults to what internal/shelf names, so the
      value is stated once in the product code rather than twice.
    required: false
    default: ""
  tag:
    description: The release tag. Defaults to what internal/shelf names.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A GitHub App rather than a personal access token, for three reasons that are all
    # about the credential rather than about what it can read -- the data is the same
    # either way, because GitHub has no releases-only scope and Contents: read grants
    # anchor's source too.
    #
    #   1. What is stored here is not a credential. A PAT in a repository secret *is* the
    #      key; this is a private key that has to be exchanged for one, so the secret on
    #      its own opens nothing.
    #   2. The token it mints lasts an hour and is revoked when the job ends.
    #   3. It belongs to no person, so it does not die when somebody leaves.
    #
    # owner and repositories are both required to be correct rather than merely present.
    # Without them the action mints a token for the calling repository, which can read
    # conflux and not anchor, and the failure arrives as a 404 that reads like a
    # missing tag.
    - name: mint a token that can read anchor
      id: app
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: veil-net
        repositories: anchor

    # The pinned build, which a local `make dist` cannot be: an anchor pinned to the
    # genesis realm refuses to handshake with any other tree.
    #
    # On veilnet-dev, fetched into the runner's tool cache and copied from there: that
    # directory survives between runs, and the fetcher keeps a file whose SHA-256 is the
    # one the shelf's manifest gives -- so an unchanged shelf costs a read rather than
    # three hundred megabytes, and nothing the manifest does not describe survives. A
    # hosted runner starts empty every time, so it fetches straight into anchor/bin.
    #
    # The token reaches the fetcher as an environment variable and never as an argument:
    # an argument is visible in `ps` to every other user on the machine.
    - name: fetch the pinned anchor binaries
      shell: bash
      env:
        ANCHOR_RELEASE_TOKEN: ${{ steps.app.outputs.token }}
        ANCHOR_REPO: ${{ inputs.repo }}
        ANCHOR_TAG: ${{ inputs.tag }}
        ONLY: ${{ inputs.targets }}
        DEST: ${{ runner.environment == 'self-hosted' && format('{0}/conflux-anchor-bin', runner.tool_cache) || 'anchor/bin' }}
      run: |
        set -euo pipefail
        make anchor-bins FETCH=1
        if [ "$DEST" != anchor/bin ]; then
          mkdir -p anchor/bin
          cp -f "$DEST"/anchor* anchor/bin/
        fi
