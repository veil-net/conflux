name: ci

# Pull requests, and a hand-run. Nothing else.
#
# This is where a change is tested: on the branch, before it is merged. GitHub tests
# refs/pull/N/merge, the branch already merged into its base, so a green pull request is
# a green merge result. What makes that a guarantee rather than a hope is branch
# protection on version3: require a pull request, require these checks, and require the
# branch to be up to date before merging.
#
# CI verifies that the code builds and runs. The utility checks -- gofmt, staticcheck,
# go mod tidy, govulncheck, the docs links, actionlint, shellcheck -- run on the machine
# that pushes, before it does, and never here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run holds the one self-hosted machine the run that replaced it is
# waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Go suite on Linux, on veilnet-dev, in one job: it is one machine and one runner
  # process, so separate jobs would queue anyway, each paying a checkout and a fetch
  # of the anchor binaries.
  #
  # **This repository is public.** A self-hosted runner is a machine that survives the
  # job, and `pull_request` runs the workflow from the head of the PR, so without this
  # guard a fork could run its own code on veilnet-dev beside a Docker socket. GitHub
  # passes no secrets to a fork's pull request, which is the mechanism; this refusal is
  # the belt beside it. The only credential here is the read-only anchor GitHub App.
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      # Nothing here pushes or fetches again, so the token is not left in .git/config --
      # on veilnet-dev, a machine that outlives the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/anchor-bins
        with:
          client-id: ${{ secrets.ANCHOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANCHOR_APP_PRIVATE_KEY }}

      # The whole suite under -race, once, and none of it skipped. A skip is green, and
      # the tests that need the real binaries skip without them, so a run that fetched
      # them and then reports "no anchor pair" has lost them. On Linux nothing skips for
      # any other reason, so zero is the right number.
      - name: the suite under -race, with the real binaries, nothing skipped
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./... > test.log 2>&1 || { cat test.log; exit 1; }
          if grep -q -- '--- SKIP' test.log; then
            echo "::error::a test skipped in the job that provides the anchor binaries" >&2
            grep -B1 -- '--- SKIP' test.log >&2
            exit 1
          fi
          ran=$(grep -c '^--- PASS' test.log)
          [ "$ran" -ge 150 ] || { echo "::error::only $ran tests ran" >&2; exit 1; }
          echo "$ran tests ran, none skipped"

      - name: every target vets, test files included
        run: make cross

      # The digests make build stamps are the pair's own: a stamp describing other bytes
      # would name the extraction directory for a pair this conflux does not carry. The
      # first line, the version and commit, is stamped only by make.
      - name: the stamped digests are the pair's own
        run: |
          set -euo pipefail
          make build >/dev/null
          diff <(bin/conflux version | sed 1d) <(go run . version | sed 1d)

  # The container suites, on a hosted runner: the boot service under a real systemd, and
  # three nodes against the live API and the production realm. The third reaches the
  # realm through its manifest's bootstrap node over UDP, and from veilnet-dev no
  # handshake gets through to it. A hosted runner is thrown away, so nothing here reaps
  # after the suites; the fetch needs the anchor credential, which a fork's pull request
  # is not given.
  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Nothing here pushes or fetches again, so the token has no reason to stay in
      # .git/config, where every later step could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Every pair, not only linux-amd64: `dist` builds every target, with the size gate.
      - uses: ./.github/actions/anchor-bins
        with:
          client-id: ${{ secrets.ANCHOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANCHOR_APP_PRIVATE_KEY }}

      - name: what this runner gives the container suites
        run: ./test/preflight.sh

      # The image's systemd layers from the Actions cache rather than apt on every run.
      # The default docker driver cannot export a cache, so a BuildKit builder of its own,
      # and the runtime token it needs -- which GitHub gives actions and not run steps --
      # handed on by a first-party one, to this job's last step only.
      - name: a BuildKit builder that can use the Actions cache
        run: docker buildx create --name cfx --driver docker-container --bootstrap

      - name: the Actions cache, for that builder
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const [k, v] of Object.entries(process.env)) {
              if (k.startsWith('ACTIONS_')) core.exportVariable(k, v)
            }

      # One invocation, so `dist` and the image are built once for both suites, which
      # then run side by side: they boot containers of different names, and only one of
      # them enrols. -O keeps each suite's output together, in one block per suite.
      - name: the boot service, and three nodes against the live API
        env:
          DOCKER_BUILD: >-
            docker buildx build --builder cfx --load -q
            --cache-from type=gha,scope=conflux-systemd
            --cache-to type=gha,mode=max,scope=conflux-systemd,ignore-error=true
        run: make -j2 -O service-test integration

  # macOS and Windows, on the operating systems that have the path handling, the file
  # modes, the DACLs and the service code, and Linux on arm64. Each fetches only its own
  # pair, so the tests that need real binaries -- extraction, the flag cross-check, the
  # shadowing check -- run here too rather than skipping. Hosted runners are thrown away,
  # but the fetch needs the anchor credential, which a fork's pull request is not given.
  #
  # As a release builds: CGO off and paths trimmed, so the suite tests the kind of binary
  # that ships, and the make build after it reuses what the suite compiled.
  platforms:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pair: darwin-arm64
          - os: windows-latest
            pair: windows-amd64
          - os: ubuntu-24.04-arm
            pair: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath
    steps:
      # Nothing here pushes or fetches again, so the token has no reason to stay in
      # .git/config, where every later step could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/anchor-bins
        with:
          client-id: ${{ secrets.ANCHOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANCHOR_APP_PRIVATE_KEY }}
          targets: ${{ matrix.pair }}

      # The version and digest come from the product code, not a second copy typed here:
      # a workflow that pinned a different version would test nothing. What this proves
      # is that the digest conflux checks every download against is the published one.
      - name: the pinned wintun is the published one
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src  = Get-Content internal/wintun/pinned.go -Raw
          $ver  = [regex]::Match($src, 'Version\s*=\s*"([^"]+)"').Groups[1].Value
          $want = [regex]::Match($src, 'ZipSHA256\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $ver -or -not $want) { throw "could not read the wintun pin from pinned.go" }
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$ver.zip" -OutFile wintun.zip
          $got = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "wintun-$ver.zip digest $got, expected $want" }
          Write-Host "wintun $ver matches its pin"

      # The same gate as Linux, over the tests that need the real binaries: here other
      # tests do skip, for the platform (a mode bit Windows does not have), and that is
      # not what this checks. Every test that needs the pair skips saying "no anchor
      # pair", so the reason is what is looked for, rather than a list of names that a
      # new test would be missing from.
      - name: the suite, with the real binaries
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v ./... > test.log 2>&1 || { cat test.log; exit 1; }
          if grep -B1 -- 'no anchor pair' test.log; then
            echo "::error::a test that needs the anchor binaries skipped" >&2
            exit 1
          fi
          grep -c '^--- PASS' test.log | xargs echo "tests passed:"

      # launchd and the SCM for real, which the suite only compiles: install registers and
      # starts nothing, status and down answer, uninstall leaves nothing behind. Nothing is
      # enrolled or started. As root on macOS; a Windows runner is an Administrator.
      - name: the boot service, against the real service manager
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          make build >/dev/null
          if [ "$RUNNER_OS" = macOS ]; then
            sudo ./test/service-host.sh bin/conflux
          else
            ./test/service-host.sh bin/conflux.exe
          fi
