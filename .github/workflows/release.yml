name: release

# A merge to version3, and nothing else.
#
# version3 is where conflux is developed; main carries no workflows at all. So this is the
# branch a merge reaches, and the branch a release comes from. Every merge builds and
# publishes: VERSION names the release, and the merge decides that there is one. The
# artifacts at that tag are replaced with the ones built from the commit that just landed.
#
# It only releases. CI tested the branch, and a merge lands only when CI is green -- which
# rests on branch protection on version3, and is unsafe without it -- so nothing here
# re-verifies. It fetches the pinned binaries, runs `make dist` (the size gate comes with
# it), attests, and publishes.
on:
  push:
    branches: [version3]
  # Rebuilds and republishes whatever VERSION currently says, exactly as a merge does.
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled: a burst of merges queues, each publishes in turn, and
# the last one wins. Cancelling could interrupt a publish half way through replacing a
# release's assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The one guard this keeps. `workflow_dispatch` is not restricted to a branch, and
    # nothing else would stop a hand-run on a feature branch publishing to the public.
    if: github.ref == 'refs/heads/version3'
    runs-on: [self-hosted, linux]

    # The only job that writes: contents to create the release, the other two for the
    # build-provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 30
    steps:
      # Not persisted: the token that can write a release has no business staying in
      # .git/config on a machine that outlives the job.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # The shelf moves, so a release carries whatever anchor published most recently,
      # which is the intent: conflux ships the newest anchor, not a remembered one.
      - uses: ./.github/actions/anchor-bins
        with:
          client-id: ${{ secrets.ANCHOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANCHOR_APP_PRIVATE_KEY }}

      # The tag is the VERSION file, verbatim: nothing is prepended, and the same string
      # is stamped into the binary. GitHub leaves an existing tag where it was cut, so a
      # tag behind the commit being built is said on every run rather than left to be
      # discovered from a `conflux version` naming a commit the tag does not reach.
      - name: what version does this tree claim?
        id: version
        run: |
          set -euo pipefail
          [ -s VERSION ] || { echo "::error::VERSION is missing or empty" >&2; exit 1; }
          tag=$(tr -d '[:space:]' < VERSION)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          at=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [ -z "$at" ]; then
            echo "$tag does not exist yet; it will be created at ${GITHUB_SHA:0:12}"
          elif [ "$at" != "$GITHUB_SHA" ]; then
            echo "::warning::$tag stays at ${at:0:12}; these artifacts are built from ${GITHUB_SHA:0:12}"
          fi

      # All seven targets, CGO_ENABLED=0 throughout, so one Linux machine cross-builds
      # every one of them. The Makefile reads the VERSION file itself.
      - run: make dist

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/conflux-*

      - name: release notes footer
        run: |
          {
            echo
            echo '## What is inside'
            echo
            # shellcheck disable=SC2016 # Markdown backticks, not a command substitution
            echo 'Each binary carries the anchor pair for its own platform. Verify what you have with `conflux version`:'
            echo
            echo '```'
            ./dist/conflux-linux-amd64 version
            echo '```'
            echo
            echo "Windows TUN mode additionally needs wintun.dll, which conflux downloads and verifies when it is first needed:"
            grep -E '^\s*(Version|ZipSHA256)\s*=' internal/wintun/pinned.go | sed 's/^\s*/  /'
          } > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/conflux-*
            dist/SHA256SUMS
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
