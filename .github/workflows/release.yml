name: release

# A merge to version3, and nothing else.
#
# version3 is where conflux is developed; main carries no workflows at all. So this is the
# branch a merge reaches, and the branch a release comes from.
#
# It was a tag push, which made cutting a release a separate manual act performed on a
# commit nobody had necessarily released from -- and a `workflow_dispatch` with no branch
# condition meant running this by hand on a feature branch built `make dist
# VERSION=<branch-name>` and published it to the public as a GitHub release.
#
# Now the tree decides. VERSION is a file, the gate below reads it, and a release happens
# exactly when somebody bumps that file and the change is merged.
#
# It does not re-run the suite. ci.yml tests the branch, and by the time a merge lands the
# question has been answered. That rests on branch protection on version3 -- a required
# pull request, required checks, and required up-to-date -- and is unsafe without it.
on:
  push:
    branches: [version3]
  # Every manual run rebuilds the version this tree claims and replaces its artifacts.
  # There is no checkbox: running this by hand is itself the request to republish.
  workflow_dispatch:

# Read by default; `build` raises its own. Neither `gate` nor `verify` can create a
# release or sign anything.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Is there a release to make? Asked cheaply, because the answer is usually no.
  #
  # Every merge to version3 runs this workflow and most merges do not change VERSION, so
  # without this each of them would cross-build seven targets, attest them and publish
  # before anything noticed there was nothing new to ship.
  #
  # The branch is named here as well as in the trigger, because `workflow_dispatch` above
  # is not restricted to a branch and nothing else in this file would stop it.
  gate:
    if: github.ref == 'refs/heads/version3'
    runs-on: [self-hosted, linux]
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: does this tree claim a version that is not published?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          # `push` on a merge, `workflow_dispatch` when somebody ran this by hand. Only
          # the latter republishes, so a merge that leaves VERSION alone still cannot
          # rebuild a published version by accident.
          dispatched: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          [ -s VERSION ] || { echo "::error::VERSION is missing or empty" >&2; exit 1; }

          # The tag is the file, verbatim. Nothing is prepended: the tags this repository
          # has published are Beta-v1.0.13, Beta-v1.0.14, Beta-v1.0.15 -- so a "v" bolted
          # on here would invent a scheme that matches none of them. Whatever VERSION
          # says is both the tag and the string stamped into the binary.
          version=$(tr -d '[:space:]' < VERSION)
          tag="$version"

          # A 404 means no release at that tag, which is the case worth acting on. Any
          # other code is asked about rather than assumed: treating a 500 as "not
          # published" would republish a version that already exists.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")

          case "$code" in
            404) release=true;  reason="$tag is not published yet -- building it" ;;
            200) release=false; reason= ;;
            *)   echo "::error::GitHub answered $code asking about $tag; refusing to guess" >&2; exit 1 ;;
          esac

          # A hand-run always builds, published or not. The case it exists for: this tree
          # has not moved, but something it embeds has. The `shelf` tag moves, and a
          # conflux release carries whatever anchor published most recently rather than a
          # remembered one -- so a fix cut in anchor reaches users only when conflux is
          # built again. Bumping VERSION for that spends a version number on a tree whose
          # own source is unchanged.
          #
          # The release is updated in place: `action-gh-release` replaces the assets of
          # the release it finds at this tag. Nothing is deleted first, so the artifacts
          # are only ever replaced by artifacts -- there is no window where the version
          # exists and its downloads do not.
          if [ "$release" = false ] && [ "$dispatched" = true ]; then
            release=true
            reason="$tag is published; this run replaces its artifacts"

            # GitHub leaves an existing tag where it was cut. So if this tree is not that
            # commit, the tag stops describing what hangs off it -- said here rather than
            # discovered later from a `conflux version` naming a commit the tag does not
            # point at.
            at=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              echo "::warning::$tag stays at ${at:0:12}; these artifacts are built from ${GITHUB_SHA:0:12}"
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

          if [ "$release" = true ]; then
            echo "$reason"
          else
            echo "$tag is already published; nothing to do"
            echo "Bump VERSION and merge to version3 to cut the next one, or run this"
            echo "workflow by hand to rebuild this one."
          fi

  verify:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The binaries this release is about to embed, fetched from the shelf.
      #
      # Without this the job could not run at all: anchor/bin is not in git, so a fresh
      # checkout has none and the very next step failed on its own message -- "a release
      # runner needs a source for them". That source exists now, which is the whole of
      # what made a conflux release possible from CI rather than from a laptop.
      - uses: ./.github/actions/anchor-bins
        with:
          app-id: ${{ secrets.ANCHOR_APP_ID }}
          private-key: ${{ secrets.ANCHOR_APP_PRIVATE_KEY }}

      # A second opinion on what the fetcher just wrote. It already refuses anchoradmin,
      # verifies every digest, and fails rather than falling back -- so these three now
      # assert what should already be true. Kept because this is the last gate before
      # bytes go to the public, and a check that costs a second is worth more here than
      # the argument for removing it.
      #
      # anchoradmin can mint realm roots. Shipping it inside conflux would hand that
      # to every user, so its absence is checked rather than assumed.
      - name: no anchoradmin is ever shipped
        run: |
          if ls anchor/bin/anchoradmin* >/dev/null 2>&1; then
            echo "::error::anchor/bin contains anchoradmin, which must never be embedded"
            exit 1
          fi

      - name: the anchor binaries are present and real
        run: |
          if [ ! -d anchor/bin ] || [ -z "$(ls -A anchor/bin 2>/dev/null)" ]; then
            echo "::error::anchor/bin is empty. The binaries are not in git; a release"
            echo "::error::runner needs a source for them. See docs/build.md."
            exit 1
          fi
          for f in anchor/bin/*; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -lt 5000000 ]; then
              echo "::error::$f is $sz bytes -- a placeholder, not a binary"
              exit 1
            fi
          done

      - name: the embedded pair is complete
        run: |
          missing=0
          for t in linux-amd64 linux-arm64 darwin-arm64 freebsd-amd64 openbsd-amd64; do
            for p in anchord anchorctl; do
              [ -f "anchor/bin/$p-$t" ] || { echo "::error::missing anchor/bin/$p-$t"; missing=1; }
            done
          done
          for t in windows-amd64 windows-arm64; do
            for p in anchord anchorctl; do
              [ -f "anchor/bin/$p-$t.exe" ] || { echo "::error::missing anchor/bin/$p-$t.exe"; missing=1; }
            done
          done
          exit $missing

  build:
    needs: [gate, verify]
    runs-on: [self-hosted, linux]

    # The only job that writes. contents to create the release, the other two for the
    # build-provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Again, because a job is a fresh checkout and anchor/bin is not in git. The
      # fetcher pins nothing of its own -- it takes what the shelf serves now -- so a
      # release carries whatever anchor published most recently, which is the intent:
      # conflux ships the newest anchor, not a remembered one.
      - uses: ./.github/actions/anchor-bins
        with:
          app-id: ${{ secrets.ANCHOR_APP_ID }}
          private-key: ${{ secrets.ANCHOR_APP_PRIVATE_KEY }}

      # All seven targets, not just this runner's: linux amd64 and arm64, darwin arm64,
      # windows amd64 and arm64, freebsd and openbsd. CGO_ENABLED=0 throughout, so one
      # Linux machine cross-builds every one of them.
      # No VERSION= override. The Makefile reads the VERSION file, which is what the gate
      # above read to decide there was anything to build -- so the number in the binary and
      # the number on the release cannot disagree. Passing github.ref_name here would set
      # it to the branch name now that this runs on a merge rather than a tag.
      - run: make dist

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/conflux-*

      - name: release notes footer
        run: |
          {
            echo
            echo '## What is inside'
            echo
            echo 'Each binary carries the anchor pair for its own platform. Verify what you have with `conflux version`:'
            echo
            echo '```'
            go run . version
            echo '```'
            echo
            echo "Windows TUN mode additionally needs wintun.dll, which conflux downloads and verifies on first use:"
            grep -E 'Version|ZipSHA256' internal/wintun/pinned.go | sed 's/^\s*/  /'
          } > notes.md

      # The tag is created here, at this commit, from the version the tree claims. That
      # ordering is the point: the tag marks a commit that has already passed the whole of
      # ci.yml and produced these seven binaries, rather than being a promise made before
      # any of it ran.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/conflux-*
            dist/SHA256SUMS
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
