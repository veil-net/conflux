name: release

# A release of every pull request's merge into version3 or dev, and nothing else. A commit
# pushed to either directly publishes nothing (the `merged` job), and goes out with the next
# merge; a hand-run publishes the branch as it is.
#
# Every change reaches dev first, by a pull request CI has passed, and version3 only as a merge
# of dev, which the owner opens (docs/testing.md, "Branches"); main carries no workflows at all.
# So there are two channels:
#
#   dev       a pre-release at `dev-latest`, replaced by every merge into dev and never the
#             repository's Latest, built with anchor's `dev-latest` embedded: the two dev
#             branches are built, and tested, together.
#   version3  the release, twice, with the same artifacts and the same notes: once at the tag
#             the VERSION file names, verbatim; and once at `latest`, which moves to every newer
#             build and is the repository's Latest release, built with anchor's `latest`. Then
#             version3 is merged back into dev, so dev never falls behind the release it made.
#
# VERSION names the release, and a maintenance pass moves it on: a new major for a major new
# feature from anchor, a new minor otherwise. A push to version3 that leaves it alone is a
# rebuild of that version: both releases are deleted, tags included, and released again from
# the commit that just landed, so a version's tag always names the commit its artifacts were
# built from. install.sh and install.ps1 read `latest` by name, unless CONFLUX_VERSION names
# another, and `conflux update` follows the channel of the build it runs from: a release's reads
# `latest`, a dev build's `dev-latest`. So a dev build reaches nobody who did not ask for
# `dev-latest`, by installing it or by updating a dev build.
#
# It only releases. CI tested the branch, and a merge lands only when CI is green -- which
# rests on branch protection on dev and version3, and is unsafe without it -- so nothing here
# re-verifies. It fetches the pinned binaries, runs `make dist` (the size gate comes with
# it), attests, and publishes.
on:
  push:
    branches: [version3, dev]
  # Rebuilds and republishes whatever VERSION currently says, exactly as a merge does.
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled: a burst of merges queues, each publishes in turn, and
# the last one wins. Cancelling could interrupt a publish between deleting a release and
# releasing it again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether this run publishes. A push does only when it is a pull request's merge: the commit
  # it lands is the one a pull request into this branch, merged, names as its merge, so the tree
  # published is the one that pull request's CI tested. Asked of the pull requests rather than
  # read from the commit's message, so a squash or a rebase merge counts, and a pushed commit
  # worded like a merge does not. A hand-run always publishes: it is how a branch is released on
  # purpose. On a hosted runner, so a direct push holds no self-hosted machine.
  merged:
    name: is this a pull request's merge?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== 'push') {
              core.info('a hand-run publishes the branch as it is');
              core.setOutput('publish', 'true');
              return;
            }
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const base = context.ref.replace(/^refs\/heads\//, '');
            // A merge and its push are one act, but the pull request can name the commit its
            // merge made a moment after the push is seen, so it is asked again, briefly. The
            // merged pull request was updated by its merge, so it is among the newest.
            for (let attempt = 1; ; attempt++) {
              const { data } = await github.rest.pulls.list({
                owner, repo, base, state: 'closed', sort: 'updated', direction: 'desc', per_page: 30,
              });
              const pr = data.find((p) => p.merged_at && p.merge_commit_sha === sha);
              if (pr) {
                core.info(`${sha.slice(0, 12)} is the merge of #${pr.number}, ${pr.title}`);
                core.setOutput('publish', 'true');
                return;
              }
              if (attempt === 6) break;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            core.notice(`${sha.slice(0, 12)} is no pull request's merge into ${base}: a direct push, which publishes nothing`);

  build:
    needs: merged
    # Two guards: a run publishes only as `merged` decides; and `workflow_dispatch` is not
    # restricted to a branch, so nothing else would stop a hand-run on a feature branch
    # publishing to the public.
    if: needs.merged.outputs.publish == 'true' && (github.ref == 'refs/heads/version3' || github.ref == 'refs/heads/dev')
    runs-on: [self-hosted, linux]

    # The only job that writes: contents to delete and create the releases, the other two
    # for the build-provenance attestation. Pull requests are read, for the notes.
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    timeout-minutes: 30
    steps:
      # Not persisted: the token that can write a release has no business staying in
      # .git/config on a machine that outlives the job.
      #
      # With every commit and tag: the notes name what changed since the previous version,
      # which needs that version's tag and the history between.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A release builds from nothing another build left. This machine keeps GOCACHE and
      # GOMODCACHE on disk between jobs, shared with CI and with every repository it builds,
      # so anything that wrote there would be in what is published. The release gets empty
      # ones of its own, under the job's temporary directory, which the runner empties before
      # and after every job; -modcacherw leaves the module cache deletable, so it can.
      - name: build and module caches of this run's own
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "GOMODCACHE=$RUNNER_TEMP/go-mod"
            echo "GOFLAGS=-modcacherw"
          } >> "$GITHUB_ENV"
      # And Go itself: setup-go would take the toolchain this machine's tool cache holds, which
      # any job here could have changed, so the release's is downloaded from go.dev into the
      # same temporary directory and checked against go.dev's published SHA-256 first.
      - uses: ./.github/actions/setup
        with:
          verified-go: 'true'

      # Every module downloaded afresh, each held to go.sum as it arrives, and then verified
      # before anything is built: `go mod verify` alone, over an empty cache, checks nothing.
      - name: the modules, downloaded and verified
        run: go mod download && go mod verify

      # anchor's `latest` moves, so a release carries whatever anchor published most
      # recently, which is the intent: conflux ships the newest anchor, not a remembered one.
      # A dev build carries anchor's dev build, `dev-latest`, for the same reason.
      - uses: ./.github/actions/anchor-bins
        with:
          client-id: ${{ secrets.ANCHOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANCHOR_APP_PRIVATE_KEY }}
          tag: ${{ github.ref == 'refs/heads/version3' && 'latest' || 'dev-latest' }}

      # The tag is the VERSION file, verbatim: nothing is prepended, and the same string
      # is stamped into the binary. `latest` and `dev-latest` are refused, since they are the
      # moving releases' tags and the version would delete one of them.
      - name: what version does this tree claim?
        id: version
        run: |
          set -euo pipefail
          [ -s VERSION ] || { echo "::error::VERSION is missing or empty" >&2; exit 1; }
          tag=$(tr -d '[:space:]' < VERSION)
          case "$tag" in
            latest | dev-latest) echo "::error::VERSION says $tag, which is a moving release's tag, not a version" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/dev ]; then
            echo "releasing dev-latest ($tag) at ${GITHUB_SHA:0:12}"
          else
            echo "releasing $tag and latest at ${GITHUB_SHA:0:12}"
          fi

      # All seven targets, CGO_ENABLED=0 throughout, so one Linux machine cross-builds
      # every one of them. The Makefile reads the VERSION file itself; a build of dev is
      # stamped as one, which `conflux version` says and `conflux update` follows: a dev
      # build updates to the newest `dev-latest`.
      - run: make dist CHANNEL="$CHANNEL"
        env:
          CHANNEL: ${{ github.ref == 'refs/heads/dev' && 'dev' || '' }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/conflux-*

      # One text for both releases: what was built, a summary of the changes since the
      # previous version (each pull request by its title and the opening of its description),
      # how to install it, and what is inside. Printed, so the run's log says what the
      # releases will.
      - name: the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A dev build is installed by naming it; nothing else ever reads it.
          pick='' pickps=''
          if [ "$BRANCH" = dev ]; then
            pick='CONFLUX_VERSION=dev-latest ' pickps="\$env:CONFLUX_VERSION = 'dev-latest'; "
          fi
          {
            ./scripts/release-notes.sh "$TAG"
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/veil-net/conflux/HEAD/install.sh | ${pick}sh"
            echo '```'
            echo
            echo 'On Windows, in PowerShell as Administrator:'
            echo
            echo '```powershell'
            echo "${pickps}irm https://raw.githubusercontent.com/veil-net/conflux/HEAD/install.ps1 | iex"
            echo '```'
            echo
            # A dev build's anchor is pinned to the dev tree, which only api-dev enrols in, and
            # its `conflux update` follows its channel, to the newest `dev-latest`.
            # shellcheck disable=SC2016 # Markdown backticks, not a command substitution
            if [ "$BRANCH" = dev ]; then
              echo 'Then `sudo conflux up --api https://api-dev.veilnet.com.au`: this build'"'"'s anchor is pinned to the dev tree, which only api-dev enrols in.'
              echo 'Already installed? `sudo conflux update`: a dev build updates to the newest `dev-latest`, as a release updates to `latest`.'
            else
              echo 'Then `sudo conflux up`. Already installed? `sudo conflux update`.'
            fi
            echo
            echo '## What is inside'
            echo
            # shellcheck disable=SC2016 # Markdown backticks, not a command substitution
            echo 'Each binary carries the anchor pair for its own platform. Verify what you have with `conflux version`:'
            echo
            echo '```'
            ./dist/conflux-linux-amd64 version
            echo '```'
            echo
            echo "Windows TUN mode additionally needs wintun.dll, which conflux downloads and verifies when it is first needed:"
            grep -E '^\s*(Version|ZipSHA256)\s*=' internal/wintun/pinned.go | sed 's/^\s*/  /'
          } > notes.md
          cat notes.md

      # Each release is deleted, with its tag, just before it is released again, rather
      # than updated in place: an update keeps the tag where it was first cut, so the tag
      # would name an older commit than the artifacts hanging off it, and reconciling the
      # asset list leaves a stale binary beside fresh ones if one upload fails. A 404 is
      # nothing there yet, and a 422 on the tag is the same; anything else stops the run
      # before anything is created. The version first, then `latest`, so `latest` is absent
      # only while its own artifacts upload.
      - name: delete the release at the version
        if: github.ref == 'refs/heads/version3'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: &delete |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: data.id });
              core.info(`deleted the release at ${tag}`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info(`no release at ${tag} yet`);
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`deleted the tag ${tag}`);
            } catch (e) {
              if (e.status !== 404 && e.status !== 422) throw e;
            }

      - if: github.ref == 'refs/heads/version3'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/conflux-*
            dist/SHA256SUMS
          body_path: notes.md
          make_latest: "false"
          fail_on_unmatched_files: true

      - name: delete the release at latest
        if: github.ref == 'refs/heads/version3'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: latest
        with:
          script: *delete

      - if: github.ref == 'refs/heads/version3'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: latest
          name: latest (${{ steps.version.outputs.tag }})
          target_commitish: ${{ github.sha }}
          files: |
            dist/conflux-*
            dist/SHA256SUMS
          body_path: notes.md
          make_latest: "true"
          fail_on_unmatched_files: true

      # A dev build is one pre-release, replaced by the next: nothing at the version, so dev's
      # merges leave nothing behind them, and never Latest, so nothing that asks for the Latest
      # release ever finds it.
      - name: delete the release at dev-latest
        if: github.ref == 'refs/heads/dev'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: dev-latest
        with:
          script: *delete

      - if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: dev-latest
          name: dev-latest (${{ steps.version.outputs.tag }}, ${{ steps.version.outputs.short }})
          target_commitish: ${{ github.sha }}
          files: |
            dist/conflux-*
            dist/SHA256SUMS
          body_path: notes.md
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true

  # version3 merged back into dev, so dev stays ahead of the release it made: a fast-forward,
  # since the release is a merge whose second parent is dev's tip, or a merge where dev has moved
  # on since. Pushed with this workflow's token, which starts no workflow, so it publishes no dev
  # build of its own; dev's next merge does.
  #
  # dev's protection must let this job push; without that the push is refused, the release is
  # out regardless, and this fails saying so.
  #
  # The checkout persists no token: back-merge.sh hands it to git through git's environment for
  # the push, and for the fetch that says why a refused push was refused.
  back-merge:
    name: merge version3 back into dev
    needs: build
    if: github.ref == 'refs/heads/version3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: dev takes version3
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/back-merge.sh "$SHA"
