# Mutation testing settings for gooze. Keys left out keep their defaults.
# Reference: https://gooze.dev/docs/config/
version: 1

paths:
  # CI runs on linux/amd64; files built only for other platforms can't be
  # tested there, so their mutants would all survive.
  exclude:
    - '_(windows|darwin|freebsd|openbsd|bsd)(_[a-z0-9]+)?\.go$'
    - '^anchor/bin_(linux_arm64|unsupported)\.go$'
    - '^internal/cli/notify_other\.go$'
    - '^internal/daemon/proc_exe_other\.go$'
    - '^internal/service/logfile\.go$'

run:
  mutation_timeout: 30        # Per-mutation timeout in seconds; the tests take a few.

# Quality gates; failing one, gooze exits with code 3.
threshold:
  total: 50                   # Score of all mutants.
  average: 40                 # Average of the per-file scores.
  file: 0                     # Score every file must reach; some files have no tests yet.
  diff:                       # --diff runs, scored on the lines a change touches: every mutant must be killed.
    total: 100
    average: 100
    file: 100
